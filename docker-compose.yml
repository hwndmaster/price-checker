# Builds the images (publish-docker.ps1) and can run them locally. On the server the shared app host runs
# them instead, from Deployment/app.json.
services:
  pricechecker-api:
    build:
      context: .                          # Root, so all projects are in scope
      dockerfile: PriceChecker.WebApi/Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: pricechecker-api
    ports:
      - "5080:8031"                       # Host port 5080 → container port 8031
    environment:
      # Absent, the Telegram price alerts of the daily scan simply stay off.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      # The shared app host's OTLP port, when one runs on this machine. Without it the exporter drops the
      # telemetry and the API runs as usual.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:21100
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: pricechecker-api
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop resolves it by itself; a Linux daemon does not
    volumes:
      - ./Data-Local/Data:/app/Data      # Persist SQLite database; also the place for the legacy JSON import files
      - ./Data-Local/Logs:/app/Logs      # Persist API error logs
    restart: unless-stopped

  pricechecker-web:
    build:
      context: ./PriceChecker.Web
      dockerfile: Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: pricechecker-web
    ports:
      - "5081:8032"                         # Host port 5081 → container port 8032
    depends_on:
      - pricechecker-api
    restart: unless-stopped

secrets:
  atom_pkg_access_token:
    environment: ATOM_PKG_ACCESS_TOKEN
