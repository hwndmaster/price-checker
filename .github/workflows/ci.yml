name: CI

on:
  push:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    # WPF requires a Windows runner
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages for NuGet
        run: dotnet nuget update source github --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config

      - name: Restore .NET tools
        run: dotnet tool restore --configfile nuget.config

      - name: Restore .NET dependencies
        run: dotnet restore PriceChecker.slnx --configfile nuget.config

      - name: Build
        run: dotnet build PriceChecker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PriceChecker.slnx --configuration Release --no-build --verbosity normal
