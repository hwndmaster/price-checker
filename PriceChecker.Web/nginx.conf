# Rendered by the nginx image's envsubst step at container start
# (/docker-entrypoint.d/20-envsubst-on-templates.sh). NGINX_ENVSUBST_FILTER in the Dockerfile limits
# substitution to PRICECHECKER_* so nginx's own $uri / $host / $1 survive untouched.
server {
    listen 8032;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Needed for React Router
    }

    # Proxy API calls to the backend container.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream ${PRICECHECKER_API_UPSTREAM};
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy the scan hub (SignalR) to the backend container. WebSockets require the explicit
    # Upgrade/Connection headers to pass through.
    location /hubs/ {
        resolver 127.0.0.11 valid=30s;
        set $hub_upstream ${PRICECHECKER_API_UPSTREAM};
        proxy_pass $hub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 100s;
    }

    # Proxy frontend telemetry to the Aspire OTLP HTTP ingest endpoint.
    #
    # Deliberately the same resolver + variable form as /api/ above. With a literal hostname nginx
    # resolves the upstream at STARTUP and refuses to start at all when it is not resolvable
    # ("[emerg] host not found in upstream"), so an app host that is absent, slow to start, or on
    # another network took the whole SPA down with it. Resolved per request instead, a broken
    # telemetry endpoint costs only telemetry — the browser exporter already backs off on failure.
    #
    # The variable form also disables nginx's usual prefix stripping, hence the explicit rewrite.
    location /otlp/ {
        resolver 127.0.0.11 valid=30s;
        set $otlp_upstream ${PRICECHECKER_OTLP_UPSTREAM};
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass $otlp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
