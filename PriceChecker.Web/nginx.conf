server {
    listen 8032;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Needed for React Router
    }

    # Proxy API calls to the backend container
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://pricechecker-api:8031;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy the scan hub (SignalR) to the backend container. WebSockets require
    # the explicit Upgrade/Connection headers to pass through.
    location /hubs/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://pricechecker-api:8031;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 100s;
    }

    # Proxy frontend telemetry to Aspire OTLP HTTP ingest endpoint
    location /otlp/ {
        proxy_pass http://pricechecker-apphost:21181/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
