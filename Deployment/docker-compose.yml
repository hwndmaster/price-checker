# PriceChecker's images, for pulling only.
#
# update.ps1 pulls them with this file, on the server and so with the server's registry login. The app host
# cannot pull a private image itself: it runs the docker CLI inside its own container, where that login
# does not exist. This file starts nothing. The app host creates the containers from app.json, and both
# services sit under the "pull" profile, so `docker compose up` here does nothing.
#
# The project name differs from the label the app host puts on the containers (price-checker), so this
# file can never take them for its own.
name: price-checker-images

services:
  price-checker-api:
    profiles: ["pull"]
    image: ${PRICE_CHECKER_REGISTRY:-ghcr.io/hwndmaster}/price-checker-api:${PRICE_CHECKER_IMAGE_TAG:-latest}

  price-checker-web:
    profiles: ["pull"]
    image: ${PRICE_CHECKER_REGISTRY:-ghcr.io/hwndmaster}/price-checker-web:${PRICE_CHECKER_IMAGE_TAG:-latest}
